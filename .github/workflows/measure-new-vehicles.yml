name: Build initial vehicle snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        vehicle:
          - model-x
          - model-y
          - sienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine Washington date
        id: date
        shell: pwsh
        run: |
          $utc = (Get-Date).ToUniversalTime()
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
            $utc,
            "Pacific Standard Time"
          ).ToString("yyyy-MM-dd")
          "value=$date" >> $env:GITHUB_OUTPUT
      - name: Build initial snapshot
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        shell: pwsh
        run: |
          python scripts\initialize-site-snapshot.py `
            --config "site-configs\${{ matrix.vehicle }}.json" `
            --date "${{ steps.date.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vehicle }}-initial-site
          path: |
            data/inventory.json
            data/listing-overrides.json
            data/refresh-state.json
            data/site-config.json
