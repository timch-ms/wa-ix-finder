name: Refresh Tesla sites once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone Tesla repositories
        shell: pwsh
        run: |
          New-Item -ItemType Directory portfolio | Out-Null
          @("wa-model-x-finder", "wa-model-y-finder") | ForEach-Object {
            git clone --quiet --depth 1 "https://github.com/timch-ms/$_.git" "portfolio/$_"
          }
      - name: Refresh Tesla snapshots
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: python scripts\refresh-tesla-sites.py portfolio refreshed 2026-09-14
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-site-snapshots
          path: refreshed/*/data/*.json
          if-no-files-found: error
