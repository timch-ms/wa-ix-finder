name: Refresh selected vehicle sites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone selected repositories
        shell: pwsh
        run: |
          New-Item -ItemType Directory portfolio | Out-Null
          @(
            "wa-ex90-finder",
            "wa-id-buzz-finder",
            "wa-eqe-suv-finder",
            "wa-eqs-suv-finder"
          ) | ForEach-Object {
            git clone --quiet --depth 1 "https://github.com/timch-ms/$_.git" "portfolio/$_"
          }
      - name: Refresh selected snapshots
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: python scripts\refresh-selected-sites.py portfolio refreshed 2026-09-11
      - uses: actions/upload-artifact@v4
        with:
          name: selected-site-snapshots
          path: refreshed/*/data/*.json
          if-no-files-found: error
