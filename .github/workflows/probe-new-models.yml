name: Probe new vehicle models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query candidate model identifiers
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: python scripts\probe-new-models.py
