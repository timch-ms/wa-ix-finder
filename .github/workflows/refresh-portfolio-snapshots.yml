name: Refresh portfolio snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone portfolio repositories
        shell: pwsh
        run: |
          New-Item -ItemType Directory portfolio | Out-Null
          @(
            "wa-model-x-finder",
            "wa-model-y-finder",
            "wa-sienna-finder",
            "wa-ex90-finder",
            "wa-id-buzz-finder",
            "wa-eqe-suv-finder",
            "wa-eqs-suv-finder"
          ) | ForEach-Object {
            git clone --quiet --depth 1 "https://github.com/timch-ms/$_.git" "portfolio/$_"
          }
      - name: Refresh sanitized snapshots
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: python scripts\refresh-portfolio-snapshots.py portfolio refreshed
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-snapshots
          path: refreshed/*/inventory.json
          if-no-files-found: error
